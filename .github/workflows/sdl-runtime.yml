name: SDL Runtime Build

on:
  push:
    branches:
      - port/sdl-step1-runtime-foundation
  pull_request:
    paths:
      - "port/sdl-runtime/**"
      - ".github/workflows/sdl-runtime.yml"

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libsdl2-dev libsdl2-mixer-dev
      - name: Configure
        run: cmake -S port/sdl-runtime -B build/sdl-runtime -G Ninja
      - name: Build
        run: cmake --build build/sdl-runtime --parallel
